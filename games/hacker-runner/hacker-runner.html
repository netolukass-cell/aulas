<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker Runner — Professor Lusca</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; width: 100%; height: 100%; overflow: hidden; }
    #gameContainer canvas { display: block; }
    #hrOverlay {
      display: none;
      position: fixed; inset: 0;
      flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,8,0.93);
      font-family: 'JetBrains Mono','Courier New',monospace;
      color: #E6EDF3; z-index: 20;
    }
    #hrQuestion {
      display: none;
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: rgba(5,12,28,0.98);
      border: 2px solid #00FFCC; border-radius: 6px;
      padding: 18px 22px;
      font-family: 'JetBrains Mono','Courier New',monospace;
      color: #E6EDF3;
      min-width: clamp(220px,55%,420px); max-width: 92%;
      z-index: 30; text-align: center;
      box-shadow: 0 0 30px rgba(0,255,204,0.3);
    }
    #mobileControls {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 8px 20px 16px;
      justify-content: space-between; align-items: flex-end;
      z-index: 10; pointer-events: none;
    }
    @media (pointer: coarse) { #mobileControls { display: flex; } }
    .mc-btn {
      pointer-events: all;
      background: rgba(0,255,204,0.12);
      border: 2px solid rgba(0,255,204,0.35);
      border-radius: 10px; color: #00FFCC;
      font-size: 22px; font-weight: 900;
      width: 64px; height: 64px; cursor: pointer;
      user-select: none; -webkit-user-select: none;
      display: flex; align-items: center; justify-content: center;
    }
    .mc-btn:active { background: rgba(0,255,204,0.32); }
  </style>
</head>
<body>
  <div id="gameContainer"></div>
  <div id="hrOverlay"></div>
  <div id="hrQuestion"></div>
  <div id="mobileControls">
    <div style="display:flex;gap:10px;">
      <button class="mc-btn" id="btnLeft">◀</button>
      <button class="mc-btn" id="btnRight">▶</button>
    </div>
    <button class="mc-btn" style="width:80px;" id="btnJump">▲ PULAR</button>
  </div>
  <script src="phaser.min.js"></script>
  <script src="hacker-runner.js"></script>
</body>
</html>
